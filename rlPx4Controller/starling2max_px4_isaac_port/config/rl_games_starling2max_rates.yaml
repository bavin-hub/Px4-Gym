params:
  seed: 8
  env:
    # Inert with this env_creator, but kept consistent with the wrapper: the
    # task squashes with tanh itself, so nothing upstream may clip.
    clip_actions: .inf
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  load_checkpoint: false
  network:
    name: simpleflight_actor_critic
    separate: true
    normalization: layer_norm
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init: {name: orthogonal_initializer, gain: 0.01}
        sigma_init: {name: const_initializer, val: 0}
        fixed_sigma: true
    mlp:
      units: [256, 256, 256]
      d2rl: false
      activation: elu
      initializer: {name: default}
  config:
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    name: starling2max_rates_px4_port
    reward_shaper: {scale_value: 1.0}
    normalize_advantage: true
    gamma: 0.995
    tau: 0.95
    ppo: true
    learning_rate: 5.0e-4
    lr_schedule: constant
    kl_threshold: 0.03
    save_best_after: 10
    score_to_win: 100000
    grad_norm: 10.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.1
    clip_value: true
    num_actors: 4096
    horizon_length: 64
    simpleflight_num_minibatches: 16
    minibatch_size: 4096
    mini_epochs: 4
    # RL-Games multiplies critic loss by 0.5; 2.0 reproduces SimpleFlight's
    # unscaled Huber critic update.
    critic_coef: 2
    normalize_input: false
    # RL-Games otherwise defaults this to true, which clamps the sampled action
    # to [-1, 1] and rescales it to the action-space bounds before the env sees
    # it -- so the task's tanh would only ever receive an already-squashed
    # value. SimpleFlight passes the raw Gaussian sample to its transform and
    # lets tanh do the bounding, so this stage has to be off. Read by both the
    # training loop and the --play player.
    clip_actions: false
    bounds_loss_coef: 0.0
    max_epochs: 30000
    normalize_value: true
    use_diagnostics: true
    value_bootstrap: true
    use_smooth_clamp: false
    player: {render: false, deterministic: true, games_num: 100000}
